name = "pulse-uptime"
main = "src/worker.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "dash.bax.vision"
custom_domain = true

[[routes]]
pattern = "stat.sorai.tw"
custom_domain = true

[[routes]]
pattern = "s.sorai.tw"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "pulse"
database_id = "289a0b9e-1457-4174-a545-2c322e91356e"

[triggers]
crons = ["* * * * *"]
