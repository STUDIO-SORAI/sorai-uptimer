name: Continuous 1-Min Uptime Pinger

on:
  schedule:
    # Runs every 5 minutes on GitHub Actions
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Uptime Monitor API Every Minute
        run: |
          # Configure SITE_URL in your GitHub Repo Secrets (Settings > Secrets and variables > Actions > New repository secret)
          # Example: https://your-project.vercel.app
          BASE_URL="${{ secrets.SITE_URL }}"
          
          if [ -z "$BASE_URL" ]; then
            echo "⚠️ SITE_URL secret is not set yet. Please add your Vercel URL in GitHub Secrets."
            exit 0
          fi
          
          TARGET_URL="${BASE_URL%/}/api/ping"
          echo "🚀 Starting 1-minute interval pings to $TARGET_URL..."
          
          for i in {1..5}; do
            echo "👉 [$(date +'%T')] Ping #$i..."
            curl -s -f -X GET "$TARGET_URL" > /dev/null || echo "Ping executed."
            if [ $i -lt 5 ]; then
              sleep 60
            fi
          done
          echo "✅ 5-minute loop finished."
