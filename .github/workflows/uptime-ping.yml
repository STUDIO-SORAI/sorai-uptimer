name: 1-Minute Uptime Pinger

on:
  schedule:
    # Runs every 5 minutes on GitHub Actions schedule (GitHub's minimum cron frequency)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Uptime Monitor API
        run: |
          # Replace with your actual deployed Vercel domain or set SITE_URL secret
          TARGET_URL="${{ secrets.SITE_URL || 'https://your-vercel-domain.vercel.app' }}/api/ping"
          echo "Pinging $TARGET_URL..."
          curl -s -f -X GET "$TARGET_URL" || echo "Ping request executed"
